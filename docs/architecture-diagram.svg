<svg viewBox="0 0 720 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">EduDesk Architecture Diagram</title>
  <desc id="desc">Staff or IT team chats with the EduDesk declarative agent in Microsoft 365 Copilot. The agent's AI Plugin exposes four OpenAPI actions (getUsers, getDevices, getTickets, createTicket) which call a FastAPI MCP server over a dev tunnel, backed by mock JSON data. Results are returned as Adaptive Cards back into the Copilot chat.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#52525b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="720" height="800" fill="#ffffff"/>

  <!-- Staff/IT -->
  <rect x="260" y="20" width="200" height="56" rx="10" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="360" y="44" text-anchor="middle" font-family="Segoe UI, Arial" font-size="15" font-weight="600" fill="#18181b">Staff / IT Team</text>
  <text x="360" y="62" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" fill="#71717a">Natural-language chat</text>

  <line x1="360" y1="76" x2="360" y2="106" stroke="#52525b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- M365 Copilot -->
  <rect x="180" y="110" width="360" height="64" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="360" y="136" text-anchor="middle" font-family="Segoe UI, Arial" font-size="15" font-weight="600" fill="#312e81">Microsoft 365 Copilot</text>
  <text x="360" y="156" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" fill="#4338ca">EduDesk Declarative Agent</text>

  <line x1="360" y1="174" x2="360" y2="204" stroke="#52525b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- AI Plugin -->
  <rect x="120" y="208" width="480" height="170" rx="10" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="360" y="232" text-anchor="middle" font-family="Segoe UI, Arial" font-size="15" font-weight="600" fill="#18181b">AI Plugin — OpenAPI v2.4</text>
  <text x="360" y="250" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" fill="#71717a">ai-plugin.json + openapi.yaml</text>

  <!-- 4 function boxes, 2x2 -->
  <rect x="145" y="266" width="210" height="48" rx="8" fill="#ffffff" stroke="#a1a1aa" stroke-width="1.2"/>
  <text x="250" y="295" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" font-weight="600" fill="#27272a">getUsers</text>

  <rect x="365" y="266" width="210" height="48" rx="8" fill="#ffffff" stroke="#a1a1aa" stroke-width="1.2"/>
  <text x="470" y="295" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" font-weight="600" fill="#27272a">getDevices</text>

  <rect x="145" y="322" width="210" height="48" rx="8" fill="#ffffff" stroke="#a1a1aa" stroke-width="1.2"/>
  <text x="250" y="351" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" font-weight="600" fill="#27272a">getTickets</text>

  <rect x="365" y="322" width="210" height="48" rx="8" fill="#ffffff" stroke="#a1a1aa" stroke-width="1.2"/>
  <text x="470" y="351" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" font-weight="600" fill="#27272a">createTicket</text>

  <line x1="360" y1="378" x2="360" y2="408" stroke="#52525b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- FastAPI -->
  <rect x="180" y="412" width="360" height="64" rx="10" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="360" y="438" text-anchor="middle" font-family="Segoe UI, Arial" font-size="15" font-weight="600" fill="#18181b">FastAPI MCP Server</text>
  <text x="360" y="458" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" fill="#71717a">mcp-server/main.py · exposed via VS Code Dev Tunnel</text>

  <line x1="360" y1="476" x2="360" y2="506" stroke="#52525b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Mock data -->
  <rect x="160" y="510" width="400" height="92" rx="10" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="360" y="536" text-anchor="middle" font-family="Segoe UI, Arial" font-size="15" font-weight="600" fill="#18181b">Mock Data (JSON)</text>
  <rect x="180" y="552" width="110" height="34" rx="6" fill="#ffffff" stroke="#a1a1aa" stroke-width="1"/>
  <text x="235" y="574" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#27272a">users.json</text>
  <rect x="305" y="552" width="110" height="34" rx="6" fill="#ffffff" stroke="#a1a1aa" stroke-width="1"/>
  <text x="360" y="574" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#27272a">devices.json</text>
  <rect x="430" y="552" width="110" height="34" rx="6" fill="#ffffff" stroke="#a1a1aa" stroke-width="1"/>
  <text x="485" y="574" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#27272a">tickets.json</text>

  <!-- Return path: Adaptive Cards -->
  <path d="M 620 444 C 690 444 690 142 620 142" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowGreen)"/>
  <rect x="600" y="270" width="118" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <text x="659" y="294" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" font-weight="600" fill="#166534">Adaptive</text>
  <text x="659" y="310" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" font-weight="600" fill="#166534">Cards</text>

  <!-- Toolkit annotation -->
  <rect x="40" y="120" width="120" height="56" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="100" y="142" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" font-weight="600" fill="#92400e">M365 Agents</text>
  <text x="100" y="158" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" font-weight="600" fill="#92400e">Toolkit</text>
  <text x="100" y="172" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" fill="#b45309">provisions agent</text>
  <line x1="160" y1="148" x2="186" y2="148" stroke="#d97706" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <text x="160" y="640" font-family="Segoe UI, Arial" font-size="12" fill="#52525b">→ Request / data flow</text>
  <text x="160" y="660" font-family="Segoe UI, Arial" font-size="12" fill="#16a34a">⤍ Response rendered as Adaptive Card in Copilot chat</text>
</svg>
